<title>Saturday Request Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column card queue for a phone, sticky progress bar on top, decisions saved per item. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --ink: #16202b;
  --muted: #5b6876;
  --line: #d5dce3;
  --accent: #0b6e8a;
  --accent-ink: #ffffff;
  --go: #1f7a45;
  --go-soft: #dff1e6;
  --stop: #b23b2e;
  --stop-soft: #f8e1de;
  --wait: #8a6100;
  --wait-soft: #f6ecd2;
  --chip: #e6ebf0;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b; --surface: #172029; --ink: #e5ebf0; --muted: #94a2b0; --line: #2a3642;
    --accent: #4fb3cf; --accent-ink: #06232c; --go: #5cc58a; --go-soft: #173325;
    --stop: #ef8a7d; --stop-soft: #3a1f1c; --wait: #e0b44f; --wait-soft: #352a12; --chip: #222d38;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b; --surface: #172029; --ink: #e5ebf0; --muted: #94a2b0; --line: #2a3642;
  --accent: #4fb3cf; --accent-ink: #06232c; --go: #5cc58a; --go-soft: #173325;
  --stop: #ef8a7d; --stop-soft: #3a1f1c; --wait: #e0b44f; --wait-soft: #352a12; --chip: #222d38;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header.bar .wrap { padding-block: 12px; display: grid; gap: 10px; }
.titlerow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.week { font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.progress { display: grid; gap: 6px; }
.progress .nums { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress .nums b { color: var(--ink); font-weight: 600; }
.meter { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; position: relative; }
.meter span { position: absolute; inset: 0 auto 0 0; background: var(--go); border-radius: 4px; transition: width .25s; }
.meter i { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .5; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: none; font: 500 13px var(--font-body); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
main .wrap { padding-block: 16px 40px; display: grid; gap: 12px; }
.status { font-size: 13px; color: var(--muted); padding: 8px 0; }
.status[data-tone="warn"] { color: var(--wait); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; border-left-width: 4px; }
.card[data-status="approved"] { border-left-color: var(--go); }
.card[data-status="rejected"] { border-left-color: var(--stop); }
.card[data-status="later"] { border-left-color: var(--wait); }
.card[data-status="none"] { border-left-color: var(--line); }
.head { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; }
.rank { font: 500 13px var(--font-data); color: var(--muted); padding-top: 2px; }
.name { font-weight: 600; font-size: 16px; min-width: 0; text-wrap: balance; }
.score { font: 600 14px var(--font-data); background: var(--chip); padding: 2px 8px; border-radius: 6px; font-variant-numeric: tabular-nums; }
.score small { font-weight: 400; color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.chip.flag { background: var(--wait-soft); color: var(--wait); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stat { display: grid; gap: 1px; min-width: 0; }
.stat dt { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.stat dd { margin: 0; font: 500 14px var(--font-data); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat dd.key { color: var(--accent); font-weight: 600; }
@media (max-width: 420px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.note { margin: 0; color: var(--muted); font-size: 14px; }
.links { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
.links a { color: var(--accent); }
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.actions button { font: 600 14px var(--font-body); padding: 10px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; min-height: 44px; }
.actions button[data-act="approved"][aria-pressed="true"] { background: var(--go); border-color: var(--go); color: var(--surface); }
.actions button[data-act="rejected"][aria-pressed="true"] { background: var(--stop); border-color: var(--stop); color: var(--surface); }
.actions button[data-act="later"][aria-pressed="true"] { background: var(--wait); border-color: var(--wait); color: var(--surface); }
.actions button:disabled { opacity: .5; cursor: default; }
.reasons { display: grid; gap: 8px; padding-top: 2px; }
.reasons p { margin: 0; font-size: 13px; color: var(--muted); }
.reasons .opts { display: flex; gap: 6px; flex-wrap: wrap; }
.reasons .opts button { font: 500 13px var(--font-body); padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.reasons .opts button[aria-pressed="true"] { background: var(--stop-soft); border-color: var(--stop); color: var(--stop); }
.reasons .opts.go button[aria-pressed="true"] { background: var(--go-soft); border-color: var(--go); color: var(--go); }
.reasons input { width: 100%; font: 14px var(--font-body); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.decided { font-size: 12px; color: var(--muted); }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.export { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.export h2 { margin: 0; font-size: 15px; }
.export p { margin: 0; font-size: 13px; color: var(--muted); }
.export textarea { width: 100%; min-height: 120px; font: 12px/1.5 var(--font-data); padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); resize: vertical; }
.export button { justify-self: start; font: 600 14px var(--font-body); padding: 10px 16px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.empty { text-align: center; color: var(--muted); padding: 32px 0; }
@media (prefers-reduced-motion: reduce) { .meter span { transition: none; } }
</style>

<header class="bar">
  <div class="wrap">
    <div class="titlerow">
      <h1>Saturday request review</h1>
      <span class="week" id="week">Batch for Sat</span>
    </div>
    <div class="progress">
      <div class="meter" aria-hidden="true"><span id="meterFill" style="width:0%"></span><i id="meterGoal"></i></div>
      <div class="nums">
        <span><b id="nApproved">0</b> approved</span>
        <span><b id="nRejected">0</b> skipped</span>
        <span><b id="nLater">0</b> later</span>
        <span><b id="nOpen">0</b> to review</span>
        <span>target <b>30</b> requests / week</span>
      </div>
    </div>
    <div class="tabs" role="group" aria-label="Filter">
      <button type="button" data-filter="open" aria-pressed="true">To review</button>
      <button type="button" data-filter="all" aria-pressed="false">All</button>
      <button type="button" data-filter="approved" aria-pressed="false">Approved</button>
      <button type="button" data-filter="later" aria-pressed="false">Later</button>
      <button type="button" data-filter="rejected" aria-pressed="false">Skipped</button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="status" id="status">Loading this week's shortlist…</div>
    <div id="list"></div>
    <section class="export" id="export" hidden>
      <h2>Requests for the buyer</h2>
      <p>The approved items as text, with the highest factory price the buyer can accept for each. Copy it into Slack or WhatsApp.</p>
      <textarea id="exportText" readonly aria-label="Approved requests as text"></textarea>
      <button type="button" id="copyBtn">Copy requests</button>
    </section>
  </div>
</main>

<script>
(() => {
  const REJECT_REASONS = ["Already common in Iraq", "No wow factor", "Margin too thin", "Shipping or battery risk", "Not right for Iraq", "Weak upstream proof"];
  const APPROVE_REASONS = ["Strong demo", "Problem-solver", "Open market here", "Seasonal timing"];
  const STATUS_LABEL = { approved: "Approved", rejected: "Skipped", later: "Later" };
  const state = { items: [], decisions: {}, filter: "open", canWrite: true, uid: null, openReason: null };
  const $ = id => document.getElementById(id);
  const fmt = n => Number(n).toLocaleString("en-US");

  try { const f = localStorage.getItem("srr-filter"); if (f) state.filter = f; } catch (e) {}

  function setStatus(text, tone) {
    const el = $("status");
    el.textContent = text || "";
    el.hidden = !text;
    if (tone) el.dataset.tone = tone; else delete el.dataset.tone;
  }

  function statusOf(id) { return (state.decisions[id] && state.decisions[id].status) || "none"; }

  function renderCounts() {
    const c = { approved: 0, rejected: 0, later: 0, none: 0 };
    state.items.forEach(it => { c[statusOf(it.id)]++; });
    $("nApproved").textContent = c.approved;
    $("nRejected").textContent = c.rejected;
    $("nLater").textContent = c.later;
    $("nOpen").textContent = c.none;
    const goal = 30, total = Math.max(goal, state.items.length);
    $("meterFill").style.width = (c.approved / total * 100) + "%";
    $("meterGoal").style.left = (goal / total * 100) + "%";
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.filter === state.filter)));
    const approved = state.items.filter(it => statusOf(it.id) === "approved");
    $("export").hidden = approved.length === 0;
    $("exportText").value = approved.map((it, i) =>
      `${i + 1}. ${it.name}\n   Ref: ${it.amazon_url}\n   Max factory price: $${Number(it.max_cost_usd).toFixed(2)} per unit (air ${fmt(it.freight_iqd)} IQD, ${it.freight_type})` +
      (state.decisions[it.id] && state.decisions[it.id].note ? `\n   Note: ${state.decisions[it.id].note}` : "")
    ).join("\n");
  }

  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
      else if (k.startsWith("data-") || k.startsWith("aria-") || k === "type" || k === "href" || k === "target" || k === "rel" || k === "id" || k === "placeholder") n.setAttribute(k, v);
      else n[k] = v;
    }
    kids.flat().forEach(k => k != null && n.append(k));
    return n;
  }

  function card(it) {
    const d = state.decisions[it.id] || {};
    const st = statusOf(it.id);
    const flags = (it.flags || "").split(",").map(s => s.trim()).filter(Boolean);
    const maxCost = Number(it.max_cost_usd);
    const c = el("article", { class: "card", "data-status": st, "aria-label": it.name });
    c.append(
      el("div", { class: "head" },
        el("span", { class: "rank", text: "#" + it.rank }),
        el("div", { class: "name", text: it.name }),
        el("span", { class: "score", "aria-label": "Score " + it.score + " of 100" }, String(it.score), el("small", { text: "/100" }))
      ),
      el("div", { class: "chips" },
        el("span", { class: "chip", text: "wow " + it.wow + "/5" }),
        el("span", { class: "chip", text: "mass " + it.mass + "/5" }),
        el("span", { class: "chip", text: "open in Iraq " + it.open + "/5" }),
        el("span", { class: "chip", text: "video " + it.video + "/5" }),
        flags.map(f => el("span", { class: "chip flag", text: f }))
      ),
      el("dl", { class: "stats" },
        el("div", { class: "stat" }, el("dt", { text: "Max factory" }), el("dd", { class: "key", text: maxCost > 0 ? "$" + maxCost.toFixed(2) : "none" })),
        el("div", { class: "stat" }, el("dt", { text: "Air freight" }), el("dd", { text: fmt(it.freight_iqd) + " IQD" })),
        el("div", { class: "stat" }, el("dt", { text: "Billed kg" }), el("dd", { text: Number(it.bill_kg).toFixed(2) })),
        el("div", { class: "stat" }, el("dt", { text: "AliExpress" }), el("dd", { text: it.ali_range_usd || "?" }))
      ),
      el("p", { class: "note", text: it.note }),
      el("div", { class: "links" },
        el("a", { href: it.amazon_url, target: "_blank", rel: "noopener", text: "Amazon listing" }),
        it.ali_url ? el("a", { href: it.ali_url, target: "_blank", rel: "noopener", text: "AliExpress match" }) : null,
        el("span", { class: "decided", text: "Amazon reviews " + fmt(it.amazon_reviews) + " · AliExpress top " + fmt(it.ali_top_sold) + " sold" })
      )
    );
    const actions = el("div", { class: "actions" });
    [["approved", "Request"], ["later", "Later"], ["rejected", "Skip"]].forEach(([act, label]) => {
      const b = el("button", { type: "button", "data-act": act, "aria-pressed": String(st === act), text: label });
      b.disabled = !state.canWrite;
      b.addEventListener("click", () => decide(it.id, st === act ? null : act));
      actions.append(b);
    });
    c.append(actions);

    if ((st === "rejected" || st === "approved") && state.canWrite) {
      const list = st === "rejected" ? REJECT_REASONS : APPROVE_REASONS;
      const chosen = new Set(d.reasons || []);
      const opts = el("div", { class: "opts" + (st === "approved" ? " go" : "") });
      list.forEach(r => {
        const b = el("button", { type: "button", "aria-pressed": String(chosen.has(r)), text: r });
        b.addEventListener("click", () => {
          chosen.has(r) ? chosen.delete(r) : chosen.add(r);
          save(it.id, { reasons: [...chosen] });
        });
        opts.append(b);
      });
      const note = el("input", { type: "text", id: "note-" + it.id, placeholder: st === "rejected" ? "Other reason (optional)" : "Note for the buyer (optional)" });
      note.value = d.note || "";
      let t;
      note.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => save(it.id, { note: note.value.trim() }), 700); });
      c.append(el("div", { class: "reasons" },
        el("p", { text: st === "rejected" ? "Why skip it? This teaches the scoring." : "What makes it a good request?" }),
        opts, note));
    }
    if (st !== "none" && d.at) {
      c.append(el("span", { class: "decided", text: STATUS_LABEL[st] + " " + new Date(d.at).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) }));
    }
    return c;
  }

  function render() {
    renderCounts();
    const list = $("list");
    // Keep the cursor in a note box when a save or live update re-renders the list.
    const act = document.activeElement;
    const keep = act && act.id && act.id.startsWith("note-") ? { id: act.id, value: act.value, s: act.selectionStart, e: act.selectionEnd } : null;
    list.replaceChildren();
    const shown = state.items.filter(it => {
      const st = statusOf(it.id);
      return state.filter === "all" || (state.filter === "open" ? st === "none" : st === state.filter);
    });
    if (state.items.length && !shown.length) {
      list.append(el("p", { class: "empty", text: state.filter === "open" ? "Everything is reviewed. Check the Approved tab for the buyer's list." : "Nothing here yet." }));
    }
    const frag = document.createDocumentFragment();
    shown.forEach(it => frag.append(card(it)));
    list.append(frag);
    list.style.display = "grid";
    list.style.gap = "12px";
    if (keep) {
      const n = document.getElementById(keep.id);
      if (n) { n.value = keep.value; n.focus(); try { n.setSelectionRange(keep.s, keep.e); } catch (e) {} }
    }
  }

  let db = null;
  async function save(id, patch) {
    const prev = state.decisions[id] || {};
    const next = Object.assign({}, prev, patch, { at: new Date().toISOString(), by: state.uid || null });
    state.decisions[id] = next;
    render();
    if (!db) return;
    try { await db.doc("decisions/" + id).set(next); }
    catch (e) {
      if (e && e.code === "invalid_argument") { state.canWrite = false; render(); setStatus("You can view this list but not record decisions. Ask Ahmed for Contributor access.", "warn"); }
      else setStatus("Couldn't save that change. Check your connection and tap it again.", "warn");
    }
  }
  function decide(id, status) {
    const prev = state.decisions[id] || {};
    save(id, { status: status || "none", reasons: status && status === prev.status ? prev.reasons || [] : [], note: prev.note || "" });
  }

  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
    state.filter = b.dataset.filter;
    try { localStorage.setItem("srr-filter", state.filter); } catch (e) {}
    render();
  }));
  $("copyBtn").addEventListener("click", () => {
    const ta = $("exportText");
    const done = () => { $("copyBtn").textContent = "Copied"; setTimeout(() => { $("copyBtn").textContent = "Copy requests"; }, 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(done, () => { ta.focus(); ta.select(); });
    } else { ta.focus(); ta.select(); }
  });

  async function start() {
    render();
    db = await claude.use("db");
    if (!db) { setStatus("Sign in to claude.ai to see and review this week's shortlist.", "warn"); return; }
    const user = await claude.use("user");
    if (user) {
      try { state.uid = await user.id(); } catch (e) {}
      try { const w = await user.can("data.write"); if (w === false) state.canWrite = false; } catch (e) {}
    }
    let gotItems = false;
    const timer = setTimeout(() => { if (!gotItems) setStatus("The shortlist can't be reached yet. It will appear when the connection comes back.", "warn"); }, 10000);
    db.collection("items").onSnapshot(snap => {
      state.items = snap.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => a.rank - b.rank);
      if (!snap.metadata.fromCache) { gotItems = true; clearTimeout(timer); }
      const wk = state.items[0] && state.items[0].week;
      if (wk) $("week").textContent = "Batch for Sat " + new Date(wk + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
      setStatus(state.items.length ? (state.canWrite ? "" : "View only: you can't record decisions on this list.") : (gotItems ? "No shortlist yet. Claude adds this week's items here after each funnel run." : "Loading this week's shortlist…"), state.canWrite ? null : "warn");
      render();
    }, () => { clearTimeout(timer); setStatus("The shortlist couldn't load. Reopen the page to try again.", "warn"); });
    db.collection("decisions").onSnapshot(snap => {
      const m = {};
      snap.docs.forEach(d => { m[d.id] = d.data(); });
      state.decisions = m;
      render();
    }, () => {});
  }
  start();
})();
</script>
